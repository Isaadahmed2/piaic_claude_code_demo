<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <input type="text" id="result" readonly>
        </div>
        <div class="buttons">
            <button class="btn fn" onclick="setOp('sin')">sin</button>
            <button class="btn fn" onclick="setOp('cos')">cos</button>
            <button class="btn fn" onclick="setOp('tan')">tan</button>
            <button class="btn fn" onclick="setOp('log')">ln</button>

            <button class="btn fn" onclick="setOp('sqrt')">√</button>
            <button class="btn fn" onclick="setOp('power')">^</button>
            <button class="btn fn" onclick="setOp('factorial')">!</button>
            <button class="btn operator" onclick="setOperator('/')">/</button>

            <button class="btn" onclick="appendNumber('7')">7</button>
            <button class="btn" onclick="appendNumber('8')">8</button>
            <button class="btn" onclick="appendNumber('9')">9</button>
            <button class="btn operator" onclick="setOperator('*')">×</button>

            <button class="btn" onclick="appendNumber('4')">4</button>
            <button class="btn" onclick="appendNumber('5')">5</button>
            <button class="btn" onclick="appendNumber('6')">6</button>
            <button class="btn operator" onclick="setOperator('-')">-</button>

            <button class="btn" onclick="appendNumber('1')">1</button>
            <button class="btn" onclick="appendNumber('2')">2</button>
            <button class="btn" onclick="appendNumber('3')">3</button>
            <button class="btn operator" onclick="setOperator('add')">+</button>

            <button class="btn" onclick="appendNumber('0')">0</button>
            <button class="btn" onclick="appendNumber('.')">.</button>
            <button class="btn clear" onclick="clearDisplay()">C</button>
            <button class="btn equals" onclick="calculate()">=</button>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
